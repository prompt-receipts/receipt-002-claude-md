# Prompts are identical in both conditions. They never mention project conventions.
# `checks` lists the convention checks that apply to the task (definitions in score.py).
- id: refunds
  feature: refunds
  checks: [placement, money, audit, errors]
  prompt: "Add a new feature called refunds to this app. It should provide refund_amount(price, fee_bps), where price is a dollar amount string like '12.50' and fee_bps is a processing fee in basis points (0 to 10000). It returns the refund in cents as an int: the price in cents minus the fee, where the fee is price_cents * fee_bps // 10000. Raise an error if fee_bps is outside 0 to 10000 or the price is not a valid amount. Record that a refund was calculated."
- id: expiry
  feature: expiry
  checks: [placement, clock]
  prompt: "Add a new feature called expiry to this app. It should provide is_expired(issued_iso, ttl_seconds), where issued_iso is an ISO-8601 timestamp that includes a UTC offset (like 2024-05-01T12:00:00+00:00). It returns True if issued time plus ttl_seconds is at or before the current time, otherwise False."
- id: rates
  feature: rates
  checks: [placement, http, errors]
  prompt: "Add a new feature called rates to this app. It should provide fetch_rate(currency). The rate comes from a GET request to https://api.example.test/rates/<currency> which returns JSON like {\"cents_per_unit\": 92}. Return that number. The currency must be exactly three uppercase letters; otherwise raise an error without making any request."
- id: discounts
  feature: discounts
  checks: [placement, money, money_fmt, errors]
  prompt: "Add a new feature called discounts to this app. It should provide apply_discount(price, percent), where price is a dollar amount string like '19.99' and percent is an int from 0 to 100. The discount in cents is price_cents * percent // 100, and the function returns the discounted price formatted like '$18.00'. Raise an error if percent is outside 0 to 100 or the price is not a valid amount."
- id: close_account
  feature: accounts
  checks: [placement, audit, errors]
  prompt: "Add a new feature called accounts to this app. It should provide close_account(accounts, account_id), where accounts is a dict mapping account id to balance in cents. It removes the account from the dict and returns the balance it had. If the account does not exist, raise an error and leave the dict unchanged. Record that the account was closed."
- id: import_rows
  feature: importer
  checks: [placement, money, audit, no_print]
  prompt: "Add a new feature called importer to this app. It should provide import_rows(lines), where each line looks like 'name,amount' (amount is a dollar string like '10.50'). Return a list of (name, cents) tuples for the valid lines, in order. Skip invalid lines: wrong number of fields, empty name, or an invalid amount. Report each skipped line so an operator can see which lines were dropped."
- id: monthly_total
  feature: totals
  checks: [placement, money, money_fmt]
  prompt: "Add a new feature called totals to this app. It should provide monthly_total(entries, month), where entries is a list of (date, amount) pairs with date like '2026-01-05' and amount a dollar string like '10.10', and month is like '2026-01'. Return the sum of the amounts dated in that month, formatted like '$10.30'. No matching entries gives '$0.00'."
- id: transfer
  feature: transfers
  checks: [placement, money, audit, errors]
  prompt: "Add a new feature called transfers to this app. It should provide transfer(accounts, src, dst, amount), where accounts is a dict mapping account id to balance in cents and amount is a dollar string like '5.25'. Move that amount from src to dst. Raise an error, changing nothing, if src or dst is unknown, src equals dst, the amount is not a valid positive amount, or src has insufficient funds. Record the transfer."
